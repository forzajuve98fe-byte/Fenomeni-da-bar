<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fenomeni da Bar — Multi-Torneo</title>
  <style>
    :root {
      --bg: #081018;
      --surface: #122232;
      --surface-2: #192e43;
      --border: rgba(148, 163, 184, 0.22);
      --text: #eef6ff;
      --muted: #9bb6cf;
      --accent: #22c55e;
      --accent-dark: #15803d;
      --gold: #fbbf24;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, rgba(34, 197, 94, 0.12), transparent 28%), var(--bg);
      color: var(--text);
      padding: 16px 12px 64px;
    }
    .wrap { max-width: 1020px; margin: 0 auto; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    h1, h2, h3 { margin: 0 0 10px; }
    .muted { color: var(--muted); font-size: 0.88rem; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button, .btn {
      border: none;
      border-radius: 10px;
      padding: 9px 13px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .tabs button { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
    .tabs button.active { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #052e16; border-color: transparent; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #052e16; }
    .btn.gold { background: linear-gradient(135deg, #fbbf24, #d97706); color: #1f1300; }
    .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: rgba(239, 68, 68, 0.16); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #09121a;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
    }
    textarea {
      min-height: 240px;
      resize: vertical;
      line-height: 1.5;
    }

    .ban-box {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px;
      padding: 11px;
      margin-top: 10px;
    }
    .target-box {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.38);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .rules-box {
      background: rgba(9, 18, 26, 0.65);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      white-space: pre-line;
      line-height: 1.55;
      font-size: 0.92rem;
    }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.74rem; font-weight: 700; }
    .badge.green { background: rgba(34, 197, 94, 0.16); color: #bbf7d0; }
    .badge.gold { background: rgba(251, 191, 36, 0.16); color: #fde68a; }
    .badge.red { background: rgba(239, 68, 68, 0.16); color: #fecaca; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    th { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; }

    .msg { padding: 10px 12px; border-radius: 10px; margin-top: 10px; font-size: 0.88rem; }
    .msg.ok { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); color: #bbf7d0; }
    .msg.err { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fecaca; }
    .msg.warn { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: #fde68a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
        <div>
          <h1>⚽ Fenomeni da Bar</h1>
          <div class="muted" id="syncStatus">Connessione a Firebase Realtime Database in corso...</div>
        </div>
        <div style="min-width:210px;">
          <label>Torneo selezionato</label>
          <select id="tournamentSelect" onchange="onTournamentChange(this.value)"></select>
        </div>
      </div>

      <div class="tabs">
        <button type="button" id="tab-play" class="active" onclick="switchTab('play')">🎯 Gioca &amp; BAN</button>
        <button type="button" id="tab-picks" onclick="switchTab('picks')">📝 Pronostici</button>
        <button type="button" id="tab-join" onclick="switchTab('join')">🙋 Richiedi Accesso</button>
        <button type="button" id="tab-cal" onclick="switchTab('cal')">📅 Calendario</button>
        <button type="button" id="tab-rank" onclick="switchTab('rank')">🏆 Classifica</button>
        <button type="button" id="tab-rules" onclick="switchTab('rules')">📜 Regolamento</button>
        <button type="button" id="tab-admin" onclick="switchTab('admin')">⚙️ Admin</button>
      </div>
      <div id="banner"></div>
    </div>

    <div id="content"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCFVa44IA7YTTvmE8qtGre09dkC7-fzTK4",
      authDomain: "fenomeni-da-bar.firebaseapp.com",
      databaseURL: "https://fenomeni-da-bar-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "fenomeni-da-bar",
      storageBucket: "fenomeni-da-bar.firebasestorage.app",
      messagingSenderId: "883901640328",
      appId: "1:883901640328:web:8980c229e2f5f94f3c793d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const rootRef = ref(db, "platform");

    const DEFAULT_RULES_TEXT = [
      "1. Categorie di gioco (3): Ogni partecipante sceglie una partita per ciascuna delle 3 categorie: Più Gol, Meno Gol e Più Cartellini. In caso di ex aequo tra più partite sulla stessa categoria, tutte le partite a pari merito risultano vincenti per quella categoria.",
      "2. Calcolo dei cartellini: Valgono esclusivamente i cartellini assegnati ai calciatori in campo (esclusi panchina, staff o provvedimenti fuori dal campo). Punteggi: Cartellino Giallo = 1 punto, Cartellino Rosso diretto = 2 punti, Doppio Giallo + Rosso = 4 punti.",
      "3. Bonus TriplettaBOMB: Chi indovina tutte e 3 le categorie nella stessa giornata (3/3) ottiene +1 punto bonus extra.",
      "4. Partite rinviate o sospese: Le partite rinviate o sospese valgono 0 punti e non assegnano punti categoria.",
      "5. Regola del BAN: La partita oggetto di BAN è bloccata per tutti i partecipanti tranne che per il detentore del BAN (ad esempio Atalanta - Inter nella Giornata 9 è esclusiva di Enrico Maria). Per il turno successivo (come la Giornata 10), il diritto al BAN spetta solo al vincitore solitario di giornata: in caso di ex aequo al primo posto, non viene assegnato alcun BAN.",
      "6. Scadenze e visibilità pronostici: I pronostici vanno inviati entro la scadenza impostata per la giornata. Prima della scadenza, chi ha inviato vede in chiaro le proprie scelte mentre quelle degli altri restano nascoste; dopo la scadenza (o per l'Admin) vengono mostrate tutte.",
      "7. Accessi, PIN e richieste: Ogni giocatore entra con il proprio nome e PIN personale (modificabile al primo accesso e in qualsiasi momento). Nuovi partecipanti possono inviare una richiesta di accesso dalla scheda dedicata, soggetta ad approvazione dell'Admin.",
      "8. Classifica e criteri di spareggio: La classifica viene ordinata per: 1) Punti Totali, 2) TriplettaBOMB, 3) Vittorie di giornata."
    ].join("\n\n");

    const BASE_PLAYERS = [
      { id: "p1", name: "Alex", pin: "1101", pinChanged: false, basePoints: 8, status: "approved" },
      { id: "p2", name: "Cesare", pin: "1102", pinChanged: false, basePoints: 8, status: "approved" },
      { id: "p3", name: "Leo/Nicolas", pin: "1103", pinChanged: false, basePoints: 7, status: "approved" },
      { id: "p4", name: "Edoardo", pin: "1104", pinChanged: false, basePoints: 6, status: "approved" },
      { id: "p5", name: "Manuel", pin: "1105", pinChanged: false, basePoints: 6, status: "approved" },
      { id: "p6", name: "Enrico Maria", pin: "1106", pinChanged: false, basePoints: 5, status: "approved" },
      { id: "p7", name: "Federico", pin: "1107", pinChanged: false, basePoints: 5, status: "approved" },
      { id: "p8", name: "Devis", pin: "1108", pinChanged: false, basePoints: 4, status: "approved" },
      { id: "p9", name: "Francesco", pin: "1109", pinChanged: false, basePoints: 2, status: "approved" },
      { id: "p10", name: "Giampiero", pin: "1110", pinChanged: false, basePoints: 2, status: "approved" }
    ];

    function makeRoundMatches(rNum, firstMatchHome, firstMatchAway) {
      return Array.from({ length: 10 }, (_, i) => ({
        id: `m${rNum}_${String(i + 1).padStart(2, "0")}`,
        home: i === 0 ? firstMatchHome : `G${rNum} Casa ${i + 1}`,
        away: i === 0 ? firstMatchAway : `G${rNum} Ospite ${i + 1}`,
        status: "scheduled",
        goals: 0,
        cardPoints: 0
      }));
    }

    function createSeedPlatform() {
      return {
        adminPin: "1234",
        adminPinChanged: false,
        activeTournamentId: "split_1",
        rulesText: DEFAULT_RULES_TEXT,
        tournaments: {
          split_1: {
            id: "split_1",
            name: "1° Split (Giornate 9 & 10)",
            activeRound: 9,
            players: BASE_PLAYERS,
            requests: [],
            rounds: {
              9: {
                deadline: "",
                banDeadline: "",
                banWinnerId: "p6",
                bannedMatchId: "m9_01",
                matches: makeRoundMatches(9, "Atalanta", "Inter"),
                picks: {}
              },
              10: {
                deadline: "",
                banDeadline: "",
                banWinnerId: null,
                bannedMatchId: null,
                matches: makeRoundMatches(10, "G10 Casa 1", "G10 Ospite 1"),
                picks: {}
              }
            }
          }
        }
      };
    }

    let state = null;
    let currentTournamentId = "split_1";
    let currentTab = "play";
    let selectedRound = 9;
    let loggedPlayer = null;
    let adminUnlocked = false;
    let seededOnce = false;
    let userPickedRoundManually = false;

    function notify(type, text) {
      document.getElementById("banner").innerHTML = `<div class="msg ${type}">${text}</div>`;
    }
    function clearNotify() {
      document.getElementById("banner").innerHTML = "";
    }

    async function savePlatform(nextState) {
      await set(rootRef, nextState);
    }

    function getTournament() {
      if (!state || !state.tournaments) return null;
      return state.tournaments[currentTournamentId] || Object.values(state.tournaments)[0] || null;
    }

    function getSortedRoundKeys(t) {
      return Object.keys(t?.rounds || {}).map(Number).filter(n => !Number.isNaN(n)).sort((a, b) => a - b);
    }

    function getApprovedPlayers(t) {
      return Object.values(t.players || {}).filter(p => p.status !== "rejected");
    }

    function getMatch(rObj, mId) {
      return Object.values(rObj.matches || {}).find(m => m.id === mId) || null;
    }

    function matchLabel(m) {
      return m ? `${m.home} - ${m.away}` : "-";
    }

    function formatTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "-";
      return d.toLocaleString("it-IT", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
    }

    function isRoundClosed(rObj) {
      if (!rObj || !rObj.deadline) return false;
      const ts = new Date(rObj.deadline).getTime();
      return !Number.isNaN(ts) && Date.now() > ts;
    }

    function getCategoryWinners(rObj) {
      const played = Object.values(rObj.matches || {}).filter(m => m.status === "played");
      if (!played.length) return { ready: false, moreGoals: [], lessGoals: [], moreCards: [] };
      const maxG = Math.max(...played.map(m => Number(m.goals) || 0));
      const minG = Math.min(...played.map(m => Number(m.goals) || 0));
      const maxC = Math.max(...played.map(m => Number(m.cardPoints) || 0));
      return {
        ready: true,
        moreGoals: played.filter(m => (Number(m.goals) || 0) === maxG).map(m => m.id),
        lessGoals: played.filter(m => (Number(m.goals) || 0) === minG).map(m => m.id),
        moreCards: played.filter(m => (Number(m.cardPoints) || 0) === maxC).map(m => m.id)
      };
    }

    function evalPlayerRound(rObj, playerId) {
      const pick = rObj?.picks?.[playerId];
      const win = getCategoryWinners(rObj);
      if (!pick || !win.ready) return { hits: 0, total: 0, triplettaBomb: false };
      let hits = 0;
      const m1 = getMatch(rObj, pick.moreGoals);
      const m2 = getMatch(rObj, pick.lessGoals);
      const m3 = getMatch(rObj, pick.moreCards);
      if (m1 && m1.status === "played" && win.moreGoals.includes(m1.id)) hits++;
      if (m2 && m2.status === "played" && win.lessGoals.includes(m2.id)) hits++;
      if (m3 && m3.status === "played" && win.moreCards.includes(m3.id)) hits++;
      const triplettaBomb = hits === 3;
      return { hits, total: hits + (triplettaBomb ? 1 : 0), triplettaBomb };
    }

    function getRoundSoloWinner(t, rNum) {
      const rObj = t.rounds?.[rNum];
      const win = getCategoryWinners(rObj);
      if (!rObj || !win.ready) return null;
      const players = getApprovedPlayers(t);
      const scores = players.map(p => ({ id: p.id, name: p.name, pts: evalPlayerRound(rObj, p.id).total }));
      const maxPts = Math.max(...scores.map(s => s.pts));
      if (maxPts <= 0) return null;
      const top = scores.filter(s => s.pts === maxPts);
      return top.length === 1 ? top[0] : null;
    }

    window.selectRound = function(n) {
      selectedRound = Number(n);
      userPickedRoundManually = true;
      clearNotify();
      render();
    };

    window.switchTab = function(tab) {
      currentTab = tab;
      clearNotify();
      ["play", "picks", "join", "cal", "rank", "rules", "admin"].forEach(k => {
        const btn = document.getElementById("tab-" + k);
        if (btn) btn.classList.toggle("active", k === tab);
      });
      render();
    };

    window.onTournamentChange = function(id) {
      currentTournamentId = id;
      loggedPlayer = null;
      userPickedRoundManually = false;
      const targetT = state?.tournaments?.[id];
      const keys = getSortedRoundKeys(targetT);
      selectedRound = targetT?.activeRound && keys.includes(Number(targetT.activeRound))
        ? Number(targetT.activeRound)
        : (keys[0] || 1);
      clearNotify();
      render();
    };

    window.loginPlayer = function() {
      const t = getTournament();
      const pId = document.getElementById("loginPlayerSel").value;
      const pin = (document.getElementById("loginPinInput").value || "").trim();
      const player = Object.values(t.players || {}).find(p => p.id === pId);
      if (!player || String(player.pin) !== pin) {
        notify("err", "Giocatore o PIN non valido.");
        return;
      }
      loggedPlayer = { ...player };
      notify(
        player.pinChanged ? "ok" : "warn",
        player.pinChanged ? `Ciao ${player.name}!` : `Primo accesso di ${player.name}: imposta subito il tuo nuovo PIN personale qui sotto.`
      );
      render();
    };

    window.logoutPlayer = function() {
      loggedPlayer = null;
      clearNotify();
      render();
    };

    window.changePlayerPin = async function() {
      const n1 = (document.getElementById("newPlayerPin").value || "").trim();
      const n2 = (document.getElementById("confirmPlayerPin").value || "").trim();
      if (n1.length < 4) return notify("err", "Il nuovo PIN deve avere almeno 4 caratteri.");
      if (n1 !== n2) return notify("err", "I due PIN non coincidono.");
      const next = structuredClone(state);
      const t = next.tournaments[currentTournamentId];
      t.players = Object.values(t.players || {}).map(p => p.id === loggedPlayer.id ? { ...p, pin: n1, pinChanged: true } : p);
      await savePlatform(next);
      loggedPlayer.pin = n1;
      loggedPlayer.pinChanged = true;
      notify("ok", "Nuovo PIN personale salvato!");
    };

    window.savePicks = async function() {
      const t = getTournament();
      const rObj = t.rounds[selectedRound];
      if (isRoundClosed(rObj)) return notify("err", "Scadenza pronostici superata per questa giornata.");

      const moreGoals = document.getElementById("pickMoreGoals").value;
      const lessGoals = document.getElementById("pickLessGoals").value;
      const moreCards = document.getElementById("pickMoreCards").value;
      if (!moreGoals || !lessGoals || !moreCards) {
        return notify("err", "Seleziona una partita per tutte e 3 le categorie.");
      }

      const canUseBan = Boolean(rObj.bannedMatchId && rObj.banWinnerId === loggedPlayer.id);
      if (rObj.bannedMatchId && !canUseBan && [moreGoals, lessGoals, moreCards].includes(rObj.bannedMatchId)) {
        return notify("err", "La partita bannata non è selezionabile in questo turno.");
      }

      const next = structuredClone(state);
      next.tournaments[currentTournamentId].rounds[selectedRound].picks = {
        ...(next.tournaments[currentTournamentId].rounds[selectedRound].picks || {}),
        [loggedPlayer.id]: { moreGoals, lessGoals, moreCards, updatedAt: new Date().toISOString() }
      };
      await savePlatform(next);
      notify("ok", "Pronostici salvati! Puoi leggerli subito in chiaro nella scheda Pronostici.");
    };

    window.saveBan = async function(targetRound) {
      const matchId = document.getElementById("banMatchSel").value || null;
      const next = structuredClone(state);
      const rObj = next.tournaments[currentTournamentId].rounds[targetRound];
      if (rObj.banWinnerId !== loggedPlayer.id) {
        return notify("err", "Non hai diritto al BAN per questa giornata.");
      }
      rObj.bannedMatchId = matchId;
      await savePlatform(next);
      notify("ok", `BAN Giornata ${targetRound} aggiornato!`);
    };

    window.submitJoinRequest = async function() {
      const name = (document.getElementById("reqName").value || "").trim();
      const desiredPin = (document.getElementById("reqPin").value || "").trim();
      const note = (document.getElementById("reqNote").value || "").trim();
      if (!name) return notify("err", "Inserisci Nome e Cognome.");
      if (desiredPin.length < 4) return notify("err", "Scegli un PIN di almeno 4 caratteri.");

      const next = structuredClone(state);
      const t = next.tournaments[currentTournamentId];
      const existingReqs = Object.values(t.requests || {});
      existingReqs.push({
        id: "req_" + Date.now(),
        name,
        desiredPin,
        note,
        status: "pending",
        createdAt: new Date().toISOString()
      });
      t.requests = existingReqs;
      await savePlatform(next);
      notify("ok", `Richiesta inviata per "${t.name}"! Ora l'Admin potrà approvarla dal pannello Admin.`);
      document.getElementById("reqName").value = "";
      document.getElementById("reqPin").value = "";
      document.getElementById("reqNote").value = "";
    };

    window.unlockAdmin = function() {
      const pin = (document.getElementById("adminPinInput").value || "").trim();
      if (pin !== String(state.adminPin)) {
        return notify("err", "PIN Admin non valido.");
      }
      adminUnlocked = true;
      notify(state.adminPinChanged ? "ok" : "warn", state.adminPinChanged ? "Pannello Admin sbloccato." : "Primo accesso Admin: puoi reimpostare subito il PIN Admin.");
      render();
    };

    window.changeAdminPin = async function() {
      const n1 = (document.getElementById("newAdminPin").value || "").trim();
      const n2 = (document.getElementById("confirmAdminPin").value || "").trim();
      if (n1.length < 4) return notify("err", "Il nuovo PIN Admin deve avere almeno 4 caratteri.");
      if (n1 !== n2) return notify("err", "I due PIN Admin non coincidono.");
      const next = structuredClone(state);
      next.adminPin = n1;
      next.adminPinChanged = true;
      await savePlatform(next);
      notify("ok", "Nuovo PIN Admin salvato!");
    };

    window.decideRequest = async function(reqId, approve) {
      const pinVal = (document.getElementById("approvePin_" + reqId)?.value || "").trim();
      const basePts = Number(document.getElementById("approvePts_" + reqId)?.value) || 0;
      const next = structuredClone(state);
      const t = next.tournaments[currentTournamentId];
      const reqs = Object.values(t.requests || []);
      const target = reqs.find(r => r.id === reqId);
      if (!target) return;

      if (approve) {
        const players = Object.values(t.players || {});
        players.push({
          id: "p_" + Date.now(),
          name: target.name,
          pin: pinVal || target.desiredPin || "1200",
          pinChanged: false,
          basePoints: basePts,
          status: "approved"
        });
        t.players = players;
        target.status = "approved";
      } else {
        target.status = "rejected";
      }
      t.requests = reqs;
      await savePlatform(next);
      notify("ok", approve ? `${target.name} approvato ed aggiunto al torneo "${t.name}"!` : `Richiesta di ${target.name} rifiutata.`);
    };

    window.savePlayerCorrection = async function(playerId, delta) {
      const next = structuredClone(state);
      const t = next.tournaments[currentTournamentId];
      const players = Object.values(t.players || {});
      const target = players.find(p => p.id === playerId);
      if (!target) return;

      const inputEl = document.getElementById("corrPts_" + playerId);
      const pinEl = document.getElementById("corrPin_" + playerId);

      let nextPts = Number(target.basePoints) || 0;
      if (typeof delta === "number") {
        nextPts += delta;
      } else if (inputEl) {
        nextPts = Number(inputEl.value) || 0;
      }

      const nextPin = pinEl ? ((pinEl.value || "").trim() || target.pin || "1101") : target.pin;
      const pinChanged = nextPin !== target.pin ? false : Boolean(target.pinChanged);

      t.players = players.map(p => p.id === playerId
        ? { ...p, basePoints: nextPts, pin: nextPin, pinChanged }
        : p
      );

      await savePlatform(next);
      if (loggedPlayer && loggedPlayer.id === playerId) {
        loggedPlayer = { ...loggedPlayer, basePoints: nextPts, pin: nextPin, pinChanged };
      }
      notify("ok", `Aggiornati punti/PIN per ${target.name} (correzione/base: ${nextPts} pt).`);
    };

    window.addManualPlayer = async function() {
      const name = (document.getElementById("newPlayerName").value || "").trim();
      const pin = (document.getElementById("newPlayerPinInput").value || "").trim() || "1200";
      const basePts = Number(document.getElementById("newPlayerBasePts").value) || 0;
      if (!name) return notify("err", "Inserisci Nome e Cognome del giocatore da aggiungere.");
      if (pin.length < 4) return notify("err", "Il PIN deve avere almeno 4 caratteri.");

      const next = structuredClone(state);
      const t = next.tournaments[currentTournamentId];
      const players = Object.values(t.players || {});
      players.push({
        id: "p_" + Date.now(),
        name,
        pin,
        pinChanged: false,
        basePoints: basePts,
        status: "approved"
      });
      t.players = players;
      await savePlatform(next);
      notify("ok", `Giocatore "${name}" aggiunto a "${t.name}"!`);
      document.getElementById("newPlayerName").value = "";
      document.getElementById("newPlayerPinInput").value = "";
      document.getElementById("newPlayerBasePts").value = "0";
    };

    window.createTournament = async function() {
      const name = (document.getElementById("newTourneyName").value || "").trim();
      const roundsCount = Math.max(1, Math.min(38, Number(document.getElementById("newTourneyRounds").value) || 10));
      const startRound = Math.max(1, Math.min(38, Number(document.getElementById("newTourneyStartRound")?.value) || 1));
      if (!name) return notify("err", "Inserisci il nome del nuovo torneo.");

      const id = "tourney_" + Date.now();
      const rounds = {};
      for (let offset = 0; offset < roundsCount; offset++) {
        const rNum = startRound + offset;
        rounds[rNum] = {
          deadline: "",
          banDeadline: "",
          banWinnerId: null,
          bannedMatchId: null,
          matches: makeRoundMatches(rNum, `G${rNum} Casa 1`, `G${rNum} Ospite 1`),
          picks: {}
        };
      }

      const next = structuredClone(state);
      next.tournaments[id] = {
        id,
        name,
        activeRound: startRound,
        players: BASE_PLAYERS.map(p => ({ ...p, basePoints: 0, pinChanged: false })),
        requests: [],
        rounds
      };
      next.activeTournamentId = id;
      currentTournamentId = id;
      selectedRound = startRound;
      userPickedRoundManually = true;
      await savePlatform(next);
      notify("ok", `Torneo "${name}" creato (${roundsCount} giornate, dalla ${startRound}° alla ${startRound + roundsCount - 1}°)!`);
    };

      next.tournaments[currentTournamentId].activeRound = Number(rNum);
      selectedRound = Number(rNum);

      await savePlatform(next);
      notify("ok", `Giornata ${rNum} impostata come giornata attiva del torneo!`);

    function render() {
      if (!state) return;
      const tourneys = Object.values(state.tournaments || {});
      const sel = document.getElementById("tournamentSelect");
      sel.innerHTML = tourneys.map(t => `<option value="${t.id}" ${t.id === currentTournamentId ? "selected" : ""}>${t.name}</option>`).join("");

      const t = getTournament();
      if (!t) return;

      const roundKeys = getSortedRoundKeys(t);
      if (!roundKeys.includes(selectedRound)) {
        selectedRound = roundKeys[0] || 1;
      }

      const el = document.getElementById("content");
      if (currentTab === "play") renderPlay(el, t, roundKeys);
      else if (currentTab === "picks") renderPicks(el, t, roundKeys);
      else if (currentTab === "join") renderJoin(el, t);
      else if (currentTab === "cal") renderCalendar(el, t, roundKeys);
      else if (currentTab === "rank") renderStandings(el, t, roundKeys);
      else if (currentTab === "rules") renderRules(el);
      else renderAdmin(el, t, roundKeys);
    }

    function renderStandings(el, t, roundKeys) {
      const players = getApprovedPlayers(t);
      const soloWinners = {};
      roundKeys.forEach(n => { soloWinners[n] = getRoundSoloWinner(t, n); });

      const rows = players.map(p => {
        let roundPts = 0;
        let triplettaBombCount = 0;
        let roundWins = 0;
        const perRound = {};
        roundKeys.forEach(n => {
          const ev = evalPlayerRound(t.rounds[n], p.id);
          perRound[n] = ev.total;
          roundPts += ev.total;
          if (ev.triplettaBomb) triplettaBombCount++;
          if (soloWinners[n] && soloWinners[n].id === p.id) roundWins++;
        });
        const base = Number(p.basePoints) || 0;
        return { name: p.name, base, perRound, triplettaBombCount, roundWins, total: base + roundPts };
      }).sort((a, b) => b.total - a.total || b.triplettaBombCount - a.triplettaBombCount || b.roundWins - a.roundWins);

      el.innerHTML = `
        <div class="card">
          <h2>🏆 Classifica — ${t.name}</h2>
          <div class="muted">Spareggi: 1) Punti Totali  2) TriplettaBOMB  3) Vittorie di Giornata</div>

                  <th>Totale</th>

                    <td><strong>${i + 1}</strong></td>
                    <td><strong>${r.name}</strong></td>
                    <td>${r.base}</td>
                    ${roundKeys.map(n => `<td>${r.perRound[n] ?? 0}</td>`).join("")}
                    <td>${r.triplettaBombCount}</td>
                    <td>${r.roundWins}</td>
                    <td><span class="badge green">${r.total} pt</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

      const matches = Object.values(rObj.matches || {});
      const players = getApprovedPlayers(t);

      el.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <h2 style="margin:0;">⚙️ Pannello Admin — ${t.name}</h2>
            <button type="button" class="btn secondary" onclick="adminUnlocked=false;clearNotify();render()">Blocca</button>
          </div>

          <h3>1. Richieste di Accesso in Attesa per "${t.name}" (${pendingReqs.length})</h3>
          ${pendingReqs.length ? pendingReqs.map(req => `
            <div class="grid-4" style="margin-bottom:8px;align-items:end;">
              <div><label>Richiedente</label><div><strong>${req.name}</strong> <span class="muted">(${req.note || "nessuna nota"})</span></div></div>
              <div><label>PIN assegnato</label><input id="approvePin_${req.id}" value="${req.desiredPin || "1200"}" /></div>
              <div><label>Punti iniziali</label><input id="approvePts_${req.id}" type="number" value="0" /></div>
              <div class="row" style="margin-top:0;">
                <button type="button" class="btn primary" onclick="decideRequest('${req.id}', true)">Approva</button>
                <button type="button" class="btn danger" onclick="decideRequest('${req.id}', false)">Rifiuta</button>
              </div>
            </div>
          `).join("") : `<div class="muted">Nessuna richiesta in attesa per questo torneo.</div>`}

          <h3 style="margin-top:16px;">2. Correzione Punti &amp; PIN Giocatori</h3>
          <div class="muted" style="margin-bottom:8px;">Usa +1 / -1 per aggiustamenti rapidi o imposta direttamente il valore Base/Correzione e salva.</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Giocatore</th>
                  <th>Base / Correzione</th>
                  <th>Modifica Rapida</th>
                  <th>PIN</th>
                  <th>Azione</th>
                </tr>
              </thead>
              <tbody>
                ${players.map(p => `
                  <tr>
                    <td><strong>${p.name}</strong></td>
                    <td style="max-width:110px;"><input id="corrPts_${p.id}" type="number" value="${Number(p.basePoints) || 0}" /></td>
                    <td>
                      <div class="row" style="margin-top:0;">
                        <button type="button" class="btn secondary" onclick="savePlayerCorrection('${p.id}', -1)">-1</button>
                        <button type="button" class="btn secondary" onclick="savePlayerCorrection('${p.id}', 1)">+1</button>
                      </div>
                    </td>
                    <td style="max-width:115px;"><input id="corrPin_${p.id}" value="${p.pin || ""}" /></td>
                    <td><button type="button" class="btn primary" onclick="savePlayerCorrection('${p.id}')">Salva</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>

          <div class="grid-4" style="margin-top:10px;align-items:end;">
            <div><label>Aggiungi giocatore (Nome e Cognome)</label><input id="newPlayerName" placeholder="Es. Marco Rossi" /></div>
            <div><label>PIN iniziale</label><input id="newPlayerPinInput" placeholder="Es. 1201" /></div>
            <div><label>Punti base/correzione</label><input id="newPlayerBasePts" type="number" value="0" /></div>
            <div><button type="button" class="btn secondary" onclick="addManualPlayer()">Aggiungi Giocatore</button></div>
          </div>

          <h3 style="margin-top:16px;">3. Indici un Nuovo Torneo</h3>
          <div class="grid-4">
            <div><label>Nome Torneo</label><input id="newTourneyName" placeholder="Es. 2° Split" /></div>
            <div><label>Giornata di partenza</label><input id="newTourneyStartRound" type="number" min="1" max="38" value="1" /></div>
            <div><label>Numero Giornate</label><input id="newTourneyRounds" type="number" min="1" max="38" value="10" /></div>
            <div style="display:flex;align-items:flex-end;"><button type="button" class="btn gold" onclick="createTournament()">Crea Torneo</button></div>
          </div>

          <h3 style="margin-top:16px;">4. Gestione Giornata ${selectedRound} &amp; BAN (Giornata attiva: G${t.activeRound || roundKeys[0] || 1})</h3>
          <div class="row" style="margin-bottom:10px;">
            ${roundKeys.map(n => `<button type="button" class="btn ${n === selectedRound ? "primary" : "secondary"}" onclick="selectRound(${n})">Giornata ${n}</button>`).join("")}
            <button type="button" class="btn gold" onclick="setActiveRound(${selectedRound})">Imposta G${selectedRound} come Attiva</button>
          </div>
          <div class="grid-2">
            <div><label>Scadenza Pronostici</label><input id="admDeadline" type="datetime-local" value="${rObj.deadline || ""}" /></div>
            <div><label>Scadenza BAN</label><input id="admBanDeadline" type="datetime-local" value="${rObj.banDeadline || ""}" /></div>
            <div>
              <label>Detentore BAN</label>
              <select id="admBanWinner">
                <option value="">-- Nessuno --</option>
                ${players.map(p => `<option value="${p.id}" ${rObj.banWinnerId === p.id ? "selected" : ""}>${p.name}</option>`).join("")}
              </select>
            </div>
            <div>
              <label>Partita Bannata</label>
              <select id="admBannedMatch">
                <option value="">-- Nessuna --</option>
                ${matches.map(m => `<option value="${m.id}" ${rObj.bannedMatchId === m.id ? "selected" : ""}>${matchLabel(m)}</option>`).join("")}
              </select>
            </div>
          </div>
          <div class="row"><button type="button" class="btn primary" onclick="saveRoundSettings()">Salva Impostazioni Giornata</button></div>

          <h3 style="margin-top:16px;">5. Partite, Gol e Cartellini — Giornata ${selectedRound} (solo in campo: Giallo=1, Rosso=2, Doppio Giallo+Rosso=4)</h3>
          <div class="row" style="margin-bottom:10px;">
            <button type="button" class="btn secondary" onclick="markAllMatchesPlayed()">Segna tutte come Giocate</button>
          </div>
          ${matches.map((m, idx) => `
            <div class="grid-4" style="margin-bottom:8px;">
              <input id="mh${idx}" value="${m.home}" placeholder="Casa" />
              <input id="ma${idx}" value="${m.away}" placeholder="Trasferta" />
              <select id="ms${idx}">
                <option value="scheduled" ${m.status === "scheduled" ? "selected" : ""}>In programma</option>
                <option value="played" ${m.status === "played" ? "selected" : ""}>Giocata</option>
                <option value="postponed" ${m.status === "postponed" ? "selected" : ""}>Rinviata/Sospesa (0pt)</option>
              </select>
              <div class="grid-2" style="gap:6px;">
                <input id="mg${idx}" type="number" min="0" value="${m.goals || 0}" title="Gol totali" />
                <input id="mc${idx}" type="number" min="0" value="${m.cardPoints || 0}" title="Punti cartellini" />
              </div>
            </div>
          `).join("")}
          <div class="row"><button type="button" class="btn primary" onclick="saveMatches()">Salva Partite e Risultati</button></div>

          <h3 style="margin-top:16px;">6. Modifica Regolamento</h3>
          <div>
            <label>Testo del Regolamento punto per punto</label>
            <textarea id="admRulesText">${state.rulesText || DEFAULT_RULES_TEXT}</textarea>
          </div>
          <div class="row">
            <button type="button" class="btn primary" onclick="saveRulesText()">Salva Regolamento</button>
            <button type="button" class="btn secondary" onclick="resetDefaultRules()">Ripristina Predefinito</button>
          </div>

          <h3 style="margin-top:16px;">7. Reimposta PIN Admin</h3>
          <div class="grid-2">
            <div><label>Nuovo PIN Admin (min. 4)</label><input id="newAdminPin" type="password" /></div>
            <div><label>Conferma PIN Admin</label><input id="confirmAdminPin" type="password" /></div>
          </div>
          <div class="row"><button type="button" class="btn secondary" onclick="changeAdminPin()">Aggiorna PIN Admin</button></div>
        </div>
      `;
    }

    onValue(rootRef, async (snap) => {
      if (!snap.exists()) {
        if (!seededOnce) {
          seededOnce = true;
          const seed = createSeedPlatform();
          await savePlatform(seed);
        }
        return;
      }
      state = snap.val();
      if (!state.rulesText) {
        state.rulesText = DEFAULT_RULES_TEXT;
      }
      if (!state.tournaments?.[currentTournamentId] && state.activeTournamentId) {
        currentTournamentId = state.activeTournamentId;
      }
      const activeT = getTournament();
      const keys = getSortedRoundKeys(activeT);
      if (!userPickedRoundManually && activeT?.activeRound && keys.includes(Number(activeT.activeRound))) {
        selectedRound = Number(activeT.activeRound);
      } else if (keys.length && !keys.includes(selectedRound)) {
        selectedRound = keys[0];
      }
      document.getElementById("syncStatus").textContent = "Sincronizzato in tempo reale con Firebase";
      render();
    }, (err) => {
      document.getElementById("syncStatus").textContent = "Errore connessione Firebase";
      notify("err", "Impossibile leggere/scrivere su Firebase: controlla le regole del Realtime Database. (" + err.message + ")");
    });
  </script>
</body>
</html>
