<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fenomeni da Bar ⚽ — 1° Split (G9 & G10)</title>
  <style>
    :root {
      --bg: #0a1017;
      --surface: #132536;
      --surface-2: #1b3045;
      --border: rgba(148, 163, 184, 0.25);
      --text: #edf5ff;
      --muted: #9db7cf;
      --accent: #22c55e;
      --accent-strong: #16a34a;
      --gold: #fbbf24;
      --danger: #ef4444;
      --info: #38bdf8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.14), transparent 22%),
                  radial-gradient(circle at right, rgba(34, 197, 94, 0.12), transparent 24%),
                  var(--bg);
      color: var(--text);
      padding: 20px 14px 64px;
    }

    .container { max-width: 980px; margin: 0 auto; }

    header {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.14), rgba(19, 37, 54, 1));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    header h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.1rem); }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 0.88rem; }

    .pill {
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
      font-size: 0.78rem;
      font-weight: 700;
    }

    nav.tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    nav.tabs button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    nav.tabs button.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #052e16;
      border-color: transparent;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .card h2 { margin: 0 0 10px; font-size: 1.08rem; }
    .card h3 { margin: 14px 0 8px; font-size: 0.95rem; color: var(--info); }
    .muted { color: var(--muted); font-size: 0.88rem; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; font-weight: 600; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #091118;
      color: var(--text);
      font-size: 0.92rem;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #052e16; }
    .btn.gold { background: linear-gradient(135deg, #fbbf24, #d97706); color: #1f1300; }
    .btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn.danger { background: rgba(239, 68, 68, 0.16); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

    .ban-box {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.36);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
    }
    .badge.green { background: rgba(34, 197, 94, 0.16); color: #bbf7d0; }
    .badge.gold { background: rgba(251, 191, 36, 0.16); color: #fde68a; }
    .badge.red { background: rgba(239, 68, 68, 0.16); color: #fecaca; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { text-align: left; padding: 9px 7px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    th { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; }

    .alert { padding: 10px 12px; border-radius: 10px; margin-top: 10px; font-size: 0.88rem; }
    .alert.ok { background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.4); color: #bbf7d0; }
    .alert.err { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fecaca; }
    .alert.warn { background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4); color: #fde68a; }

    .match-item {
      background: rgba(148, 163, 184, 0.06);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
    }
  </style>
</head>
